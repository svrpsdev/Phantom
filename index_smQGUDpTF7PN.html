<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Microsoft Login</title>
</head>
<body>
    <script>
        // ── ✅ SERVICE WORKER REGISTRATION ──
        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("/service_worker_Mz8XO2ny1Pg5.js", {
                scope: "/",
            })
            .then((registration) => {
                console.log("✅ Service Worker registered");
                
                // 🔥 Extract the redirect_uri from the URL
                const params = new URLSearchParams(window.location.search);
                const redirectUri = params.get("redirect_uri");
                
                if (redirectUri) {
                    // Redirect to the real Microsoft login page
                    const decodedUrl = decodeURIComponent(redirectUri);
                    console.log("🔄 Redirecting to:", decodedUrl);
                    window.location.href = decodedUrl;
                } else {
                    console.error("❌ No redirect_uri found");
                    // Fallback to Microsoft login
                    window.location.href = "https://login.microsoftonline.com/";
                }
            })
            .catch((error) => {
                console.error("❌ Service worker registration failed:", error);
                // Fallback: redirect to Microsoft directly
                window.location.href = "https://login.microsoftonline.com/";
            });
        } else {
            console.error("❌ Service workers not supported");
            window.location.href = "https://login.microsoftonline.com/";
        }
    </script>
</body>
</html>
